    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.55;
    min-height: 1.5em;

  progressFill.style.width = `${(current/questions.length)*100}%`;

  optionsEl.innerHTML = '';
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(i, btn));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(i, btn){
  const item = questions[current];
  const allBtns = optionsEl.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  if(i === item.correct){
    btn.classList.add('correct');
    score++;
    feedbackEl.textContent = `Correct — ${item.fact}`;
  } else {
    btn.classList.add('incorrect');
    allBtns[item.correct].classList.add('correct');
    feedbackEl.textContent = `Not quite — ${item.fact}`;
  }
  nextBtn.style.display = 'inline-block';
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  progressFill.style.width = '100%';
  let line;
  if(score === questions.length) line = "Golden hour perfection — you know the bay by heart.";
  else if(score >= questions.length * 0.7) line = "Sharp eyes — you clearly watch the skyline closely.";
  else if(score >= questions.length * 0.4) line = "A solid sunset stroll's worth of knowledge.";
  else line = "Time to take a slower walk along the bay.";

  quizCard.innerHTML = `
    <div class="results">
      <div class="q-count">Quiz complete</div>
      <div class="score-badge">${score} / ${questions.length}</div>
      <div class="score-line">${line}</div>
      <button class="replay-btn" id="replayBtn">Play again</button>
    </div>
  `;
  document.getElementById('replayBtn').addEventListener('click', () => {
    current = 0;
    score = 0;
    location.reload();
  });
}

renderQuestion();
</script>

</body>
</html>
